name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Vet (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout bindings
        uses: actions/checkout@v4

      - name: Checkout libopencie-pkcs11
        uses: actions/checkout@v4
        with:
          repository: M0Rf30/opencie-pkcs11
          path: opencie-pkcs11
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            libcrypto++-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpcsclite-dev libpng-dev libssl-dev libxml2-dev \
            ninja-build pkg-config python3-pip
          # Install a recent Meson (>=0.64) which supports meson.options.
          # Ubuntu 22.04 ships 0.61, which fails on upstream's meson.options.
          sudo pip3 install --upgrade 'meson>=1.3.0'
          meson --version

      - name: Build & install libopencie-pkcs11
        working-directory: opencie-pkcs11
        run: |
          meson setup builddir --buildtype=release --prefix=/usr
          meson compile -C builddir
          sudo meson install -C builddir
          sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify gofmt
        run: |
          fmtout=$(gofmt -l .)
          if [ -n "$fmtout" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmtout"
            exit 1
          fi

      # The cgo bindings include <pkcs11/pkcs11.h> and <opencie/cie_ext.h>.
      # `meson install` only ships cie_ext.h to /usr/include/opencie; the
      # standard Cryptoki header lives at shared/src/pkcs11/pkcs11.h in the
      # upstream source tree, so we point CGO_CFLAGS at the checkout.
      - name: Configure CGO include paths
        run: |
          src=${{ github.workspace }}/opencie-pkcs11
          echo "CGO_CFLAGS=-I${src}/shared/src -I${src}/include" >> "$GITHUB_ENV"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
